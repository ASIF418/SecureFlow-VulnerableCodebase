name: SecureFlow DevSecOps Pipeline

on:
  push:
  pull_request:

jobs:
  hello-world:
    runs-on: ubuntu-latest

    steps:
      - name: Say Hello
        run: echo "Hello World from the SecureFlow DevSecOps Pipeline!"

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.24.3"
          wget -q "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full Git history with Gitleaks
        run: |
          gitleaks git . --log-opts="--all" --redact --verbose

  sonarqube-scan:
    name: SonarQube Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Export SonarQube findings as JSON
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mkdir -p evidence

          curl -s \
            -H "Authorization: Bearer $SONAR_TOKEN" \
            "https://sonarcloud.io/api/issues/search?componentKeys=ASIF418_SecureFlow-VulnerableCodebase&ps=500" \
            > evidence/sonarqube-findings.json

          jq '.' evidence/sonarqube-findings.json

      - name: Upload SonarQube findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-findings
          path: evidence/sonarqube-findings.json

      - name: Enforce SonarQube severity gate
        run: |
          BLOCKING=$(jq '
            [
              .issues[]
              | select(
                  (.status == "OPEN")
                  and
                  (
                    .severity == "BLOCKER"
                    or
                    .severity == "CRITICAL"
                  )
                )
            ] | length
          ' evidence/sonarqube-findings.json)

          echo "OPEN BLOCKER/CRITICAL findings: $BLOCKING"

          if [ "$BLOCKING" -gt 0 ]; then
            echo "Security gate FAILED."
            exit 1
          fi

          echo "No OPEN BLOCKER or CRITICAL findings."
          echo "MAJOR/MINOR findings will be routed to AppSec."
  trivy-image-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build auth-service image
        run: |
          docker build -t secureflow-auth:latest ./services/auth-service

      - name: Scan auth-service image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secureflow-auth:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
  trivy-k8s-scan:
    name: Trivy Kubernetes Configuration Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan Kubernetes manifests with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: infra/kubernetes/
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
  checkov-scan:
    name: Checkov Terraform Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov on Terraform
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/terraform/
          framework: terraform
          output_format: cli
          hard_fail_on: HIGH,CRITICAL
